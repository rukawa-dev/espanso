# espanso 구성 파일

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/config.schema.json

# 완전한 소개는 공식 문서에서 확인하세요: [https://espanso.org/docs/](https://espanso.org/docs/)

# 이 파일은 espanso의 전역 설정을 정의하는 데 사용합니다.
# 모든 애플리케이션에서 기본적으로 적용되지만,
# 애플리케이션별로 설정을 덮어쓸 수도 있습니다.

# 맞춤 설정을 쉽게 하기 위해 자주 사용하는
# 파라미터를 주석 해제하고 조정하면 됩니다.

# --- 토글 키

# espanso를 비활성화하거나 활성화하는 데 사용하는 키를 설정합니다 (두 번 누를 때)
# 사용 가능한 옵션: CTRL, SHIFT, ALT, CMD, OFF
# LEFT_CTRL, RIGHT_SHIFT 등 구체적인 키도 설정할 수 있습니다.
# toggle_key: ALT
# 토글 키를 완전히 비활성화하고 싶으면
# toggle_key: OFF

# --- 입력 방식 백엔드

# espanso는 텍스트를 애플리케이션에 주입하는 여러 방식을 지원합니다.
# 기본값은 "Auto"로 대부분의 경우 잘 작동합니다.
# 문제가 있을 경우 "Clipboard" 또는 "Inject" 백엔드를 시도할 수 있습니다.
# backend: Clipboard

# --- 자동 재시작

# 설정 파일이 변경되면 어시스턴트 프로세스를 재시작하여 설정을 갱신합니다.
# 기본값은 true이며, false로 설정하면 자동 재시작이 비활성화됩니다.
# auto_restart: false

# --- 클립보드 임계값

# 긴 텍스트를 한 글자씩 주입하는 것이 느리므로,
# clipboard_threshold 설정된 글자 수 이상이면 클립보드를 이용해 주입합니다.
# 기본값은 100자입니다.
# clipboard_threshold: 100

# --- 정규식 버퍼 크기

# 정규식 트리거를 위해 메모리에 보관할 최대 문자 수입니다.
# 이 값은 정규식 트리거 최대 길이를 결정하며 기본값은 30자입니다.
# 너무 크면 메모리 사용량이 늘어난다는 점에 유의하세요.
# max_regex_buffer_size: 30

# 더 많은 옵션 목록은 공식 문서에서 확인하세요: [https://espanso.org/docs/](https://espanso.org/docs/)
